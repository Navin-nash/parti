<!doctype html>
<meta charset="utf-8" />
<title>Book an appointment</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #F9FAFB; color: #111827; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 48px 24px; }
  .steps { display: flex; gap: 8px; margin-bottom: 32px; font-size: 13px; color: #9CA3AF; }
  .steps .on { color: #6366F1; font-weight: 600; }
  h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; }
  .sub { color: #6B7280; margin-bottom: 32px; }

  .card {
    background: #fff; border: 1px solid #E5E7EB; border-radius: 16px;
    box-shadow: 0 4px 24px rgba(17,24,39,.05); padding: 24px; margin-bottom: 24px;
  }
  .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: #6B7280; margin-bottom: 6px; }
  select, input {
    width: 100%; font: inherit; font-size: 14px; padding: 10px 12px;
    border: 1px solid #E5E7EB; border-radius: 10px; background: #fff; margin-bottom: 16px;
  }
  select:focus, input:focus { outline: none; border-color: #6366F1; box-shadow: 0 0 0 3px #6366F133; }

  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .cal .dow { font-size: 12px; color: #9CA3AF; text-align: center; padding-bottom: 4px; }
  .cal button {
    aspect-ratio: 1; border: 1px solid #E5E7EB; background: #fff; border-radius: 10px;
    font: inherit; font-size: 13px; cursor: pointer; transition: all .2s ease;
  }
  .cal button:hover { border-color: #6366F1; transform: translateY(-1px); }
  .cal button.sel { background: #6366F1; color: #fff; border-color: #6366F1; }
  .cal button.dim { color: #D1D5DB; }

  .times { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .times button {
    border: 1px solid #E5E7EB; background: #fff; border-radius: 999px;
    padding: 8px 16px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .times button.sel { background: #6366F1; border-color: #6366F1; color: #fff; }

  .cta {
    background: linear-gradient(135deg, #6366F1, #3B82F6); color: #fff; border: none;
    border-radius: 12px; padding: 14px 28px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .cta:hover { box-shadow: 0 8px 20px rgba(99,102,241,.3); }
  .note { font-size: 13px; color: #9CA3AF; margin-top: 16px; }
</style>
<body>
  <div class="wrap">
    <div class="steps"><span class="on">1 Clinic</span> · <span class="on">2 Service</span> · <span class="on">3 Time</span> · <span>4 Confirm</span></div>
    <h1>Book an appointment</h1>
    <p class="sub">Choose a time that works for you and we'll take care of the rest.</p>

    <div class="card">
      <h2>Your details</h2>
      <label for="clinic">Clinic</label>
      <select id="clinic"><option>Riverside Community Clinic</option><option>Eastgate Health Centre</option></select>
      <label for="svc">Service</label>
      <select id="svc"><option>Blood test</option><option>Vaccination</option><option>Dressing change</option></select>
    </div>

    <div class="card">
      <h2>September 2026</h2>
      <div class="cal">
        <div class="dow">M</div><div class="dow">T</div><div class="dow">W</div><div class="dow">T</div>
        <div class="dow">F</div><div class="dow">S</div><div class="dow">S</div>
        <button class="dim">8</button><button class="dim">9</button><button>10</button><button>11</button>
        <button>12</button><button class="dim">13</button><button class="dim">14</button>
        <button>15</button><button class="sel">16</button><button>17</button><button>18</button>
        <button>19</button><button class="dim">20</button><button class="dim">21</button>
      </div>

      <div class="times">
        <button>09:00</button><button class="sel">09:20</button><button>09:40</button>
        <button>10:00</button><button>10:20</button><button>11:00</button>
        <button>11:20</button><button>14:00</button><button>14:20</button>
      </div>
    </div>

    <button class="cta">Continue</button>
    <p class="note">You can change or cancel your appointment later.</p>
  </div>
</body>
</html>
